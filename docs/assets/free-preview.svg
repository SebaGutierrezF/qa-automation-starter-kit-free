<title id="previewTitle">QA Automation Starter Kit Community Free — illustrated local test workflow</title>
<desc id="previewDesc">Illustration, not an application screenshot. Shows the included local demo login page concept, two API tests, two Selenium browser tests and locally verified pytest results. No hosted service is depicted.</desc>
